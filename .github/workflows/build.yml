name: Build

# The build reads; it never writes to the repo. Without this it inherits the
# repository default token scope, which on an older repo is write-all, and
# anything the build chain executes runs with it.
permissions:
  contents: read

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

jobs:
  build:
    name: Build and Validate
    runs-on: windows-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive

      # C++ toolchain for the pixi `package` task's cmake/msbuild build.
      - name: Setup Visual Studio environment
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      # run-install: false - this workspace declares no conda dependencies
      # (pixi is a task runner; cmake and PowerShell are system tools). The
      # action's post-install `pixi list` exits 1 on an empty environment, so
      # we let `pixi run package` provision on demand instead.
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          run-install: false

      # The camera boundary maths every rendered frame passes through has no
      # other gate: without this the suites are compiled by `build-release` and
      # then never executed anywhere.
      - name: Run tests
        shell: pwsh
        run: pixi run test

      # Build + package through the SAME command a developer runs locally. All
      # build logic lives in the pixi task chain (setup -> build-release ->
      # package); the workflow owns none, so local and CI can't drift.
      - name: Build and package
        shell: pwsh
        run: pixi run package

      - name: Verify installer was produced
        shell: pwsh
        run: |
          $zip = Get-ChildItem release/*-installer.zip -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $zip) {
            Write-Host "::error::No installer ZIP was produced by 'pixi run package'"
            exit 1
          }
