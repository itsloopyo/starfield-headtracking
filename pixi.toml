[workspace]
name = "starfield-head-tracking"
version = "0.1.0"
description = "Head tracking mod for Starfield using the CameraUnlock shared library"
license = "MIT"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
sync = "git submodule update --remote cameraunlock-core"

# No -G: let CMake auto-detect the installed Visual Studio generator. Pinning
# "Visual Studio 17 2022" broke on CI once the windows runner image moved to
# VS 2026 (VS 17 absent); auto-detect picks whatever VS the machine has.
# Gated on the cache, not the directory: cmake creates `build` before it
# configures, so a configure that fails (missing generator, uninitialised
# submodule) leaves the directory behind and every later `pixi run build` then
# skipped setup and failed on the absent cache instead.
setup = { cmd = """
    powershell -Command "if (-not (Test-Path 'build/CMakeCache.txt')) { cmake -B build -A x64 } else { Write-Host 'Build directory exists, skipping setup' -ForegroundColor Yellow }"
""" }

# Bump vendored Ultimate ASI Loader to latest upstream within pinned range.
# Manual; commit the result. CI does not run this.
update-deps = "powershell -ExecutionPolicy Bypass -File scripts/update-deps.ps1"

build = { cmd = "cmake --build build --config Debug", depends-on = ["setup"] }
build-release = { cmd = "cmake --build build --config Release", depends-on = ["setup"] }

install = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1 Release", depends-on = ["build-release"] }
test = { cmd = "ctest --test-dir build -C Release --output-on-failure", depends-on = ["build-release"] }
uninstall = "scripts\\uninstall.cmd"

# No PowerShell variables in an inline pixi cmd: pixi's own shell expands $d
# to the empty string before powershell.exe ever sees it, and the task dies
# with "Missing variable name after foreach".
clean = { cmd = """
    powershell -Command "if (Test-Path 'build') { Remove-Item 'build' -Recurse -Force }; Write-Host 'Build artifacts cleaned' -ForegroundColor Green"
""" }

clean-all = { cmd = """
    powershell -Command "if (Test-Path 'build') { Remove-Item 'build' -Recurse -Force }; if (Test-Path 'release') { Remove-Item 'release' -Recurse -Force }; Write-Host 'All build artifacts cleaned' -ForegroundColor Green"
""" }

package = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["build-release"] }
release = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/release.ps1" }
release-nightly = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/release-nightly.ps1" }

# Core's own validators, run by hand. Both need node, which this workspace does
# not declare as a dependency, so neither is wired into `package` or into CI -
# the release gates that must always run live in the packager instead.
# validate-manifest reads the built installer ZIP, hence the dependency.
validate-manifest = { cmd = "node cameraunlock-core/scripts/validate-manifest.mjs", depends-on = ["package"] }
validate-notices = { cmd = "node cameraunlock-core/scripts/validate-notices.mjs" }
show-changelog = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/show-changelog.ps1" }

[dependencies]
